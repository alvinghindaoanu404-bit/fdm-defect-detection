<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jarvis" />
    <title>Jarvis</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="orb" id="orb" aria-hidden="true"></span>
        <div>
          <h1>Jarvis</h1>
          <p class="sub" id="status-line">Connecting…</p>
        </div>
      </div>
      <nav class="actions" aria-label="Panels">
        <button class="icon-btn" id="btn-speak" type="button" aria-pressed="false" title="Read replies aloud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /></svg>
          <span class="sr">Read replies aloud</span>
        </button>
        <button class="icon-btn" id="btn-drafts" type="button" title="Email drafts waiting for approval">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z" /><path d="m3 7 9 6 9-6" /></svg>
          <span class="badge" id="badge-drafts" hidden>0</span>
          <span class="sr">Drafts</span>
        </button>
        <button class="icon-btn" id="btn-alerts" type="button" title="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2z" /><path d="M10 20a2 2 0 0 0 4 0" /></svg>
          <span class="badge" id="badge-alerts" hidden>0</span>
          <span class="sr">Notifications</span>
        </button>
        <button class="icon-btn" id="btn-new" type="button" title="Start a new conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span class="sr">New conversation</span>
        </button>
      </nav>
    </header>

    <button class="banner" id="wa-banner" type="button" hidden>WhatsApp needs linking. Tap to show the QR code.</button>

    <main id="chat" aria-live="polite">
      <section class="welcome" id="welcome">
        <h2>Good to see you.</h2>
        <p>Ask me about your email, calendar or WhatsApp, or have me look something up.</p>
      </section>
    </main>

    <footer class="composer">
      <div class="chips" id="chips">
        <button type="button" data-prompt="/brief">Brief me</button>
        <button type="button" data-needs="email" data-prompt="What unread emails need my attention?">Unread email</button>
        <button type="button" data-needs="calendar" data-prompt="What's on my calendar today and tomorrow?">My calendar</button>
        <button type="button" data-needs="whatsapp" data-prompt="Summarise my WhatsApp messages from today.">WhatsApp</button>
      </div>
      <form id="form" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Message Jarvis" aria-label="Message Jarvis" enterkeyhint="send"></textarea>
        <button class="icon-btn" id="btn-mic" type="button" title="Speak" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          <span class="sr">Speak</span>
        </button>
        <button class="send" id="btn-send" type="submit" title="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12 20 4l-6 16-3-7-7-1z" /></svg>
          <span class="sr">Send</span>
        </button>
      </form>
    </footer>

    <aside class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="icon-btn" id="sheet-close" type="button" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
            <span class="sr">Close</span>
          </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </aside>

    <script src="/app.js" type="module"></script>
  </body>
</html>
